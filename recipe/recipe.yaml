context:
  name: "pyedb"
  version: "0.85.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyedb-${{ version }}.tar.gz
  sha256: eb7262f61c509c67ccf3877f7910320fe7d93ca98b496c6b0e623ff4d14987a9

build:
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - flit-core >=3.2,<4
    - pip
    - python ${{ python_min }}.*
  run:
    - ansys-edb-core >=0.3.3
    - ansys-pythonnet
    - defusedxml >=0.7
    - numpy >=1.20.0
    - psutil
    - pydantic >=2.6.4,<2.14
    - python >=${{ python_min }}
    - ${{ "pywin32 >=303" if win }}
    - ${{ "cffi >=1.16" if linux }}
    - toml >=0.10.2
    - xmltodict
    - typer >=0.20.0

tests:
  - python:
      imports:
        - pyedb
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://pypi.org/project/pyedb/
  summary: 'Python library to use the EDB client library'
  repository: https://github.com/ansys/pyedb-core
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - svandenb-dev
    - hui-zhou-a
    - SMoraisAnsys
